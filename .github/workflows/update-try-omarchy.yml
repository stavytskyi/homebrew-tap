name: Update Try Omarchy

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-try-omarchy
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update-try-omarchy.py --self-test
          gh api repos/omacom/try-omarchy/releases/latest > "$RUNNER_TEMP/release.json"
          python3 scripts/update-try-omarchy.py "$RUNNER_TEMP/release.json"
      - name: Validate the cask and signed application
        if: steps.release.outputs.version != '' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          tap="$(brew --repository)/Library/Taps/stavytskyi/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew style Casks/try-omarchy.rb
          brew audit --cask --strict stavytskyi/tap/try-omarchy
          vm="$HOME/Library/Application Support/Try Omarchy/VM/v1"
          mkdir -p "$vm/disks/current" "$vm/boot"
          printf 'preserve existing disk\n' > "$vm/disks/current/rootfs.ext4"
          printf 'preserve existing kernel\n' > "$vm/boot/kernel"
          shasum -a 256 "$vm/disks/current/rootfs.ext4" "$vm/boot/kernel" > "$RUNNER_TEMP/vm.sha256"
          brew install --cask stavytskyi/tap/try-omarchy
          codesign --verify --deep --strict --verbose=2 '/Applications/Try Omarchy.app'
          spctl --assess --type execute --verbose=2 '/Applications/Try Omarchy.app'
          shasum -a 256 -c "$RUNNER_TEMP/vm.sha256"
          brew uninstall --cask stavytskyi/tap/try-omarchy
          shasum -a 256 -c "$RUNNER_TEMP/vm.sha256"
          git diff --check
      - name: Publish the validated recipe
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/try-omarchy.rb
          git commit -m "chore: update Try Omarchy to $VERSION"
          gh auth setup-git
          git push origin HEAD:main
